[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vav"
version = "0.1.0"
description = "Vision Transformer attention dynamics toolkit for fine-grained bird classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "pillow>=9.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
vav = "vav.cli:main"

[tool.setuptools]
packages = ["vav"]
